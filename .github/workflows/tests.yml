name: Tests

# Before this workflow the repository had no CI and nine R test files, none of
# which ran. All nine errored on their first line. Four resolved paths from the
# repository root while testthat runs from tests/; four more were written
# against functions that have never existed here; one called an API that the
# file it names does not provide. tests/README.md described a working suite.
#
# Pull requests and pushes to main only. No schedule: nothing here reaches an
# external service, so nothing can rot between commits.

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  r:
    name: R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: install.packages(c("testthat", "survey", "tidyr", "dplyr"))
        shell: Rscript {0}

      # run_all_tests.R calls test_dir("tests"), which fails the job on any
      # error or failure rather than printing and exiting 0.
      - name: Run the test suite
        run: Rscript tests/run_all_tests.R
